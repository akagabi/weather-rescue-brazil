[project]
name = "wrb"
version = "0.0.1"
description = "Weather Rescue Brazil - AI-assisted, human-verified rescue of historical Brazilian weather records"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.27", "pillow>=10.0", "pydantic>=2.7", "certifi>=2024.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
